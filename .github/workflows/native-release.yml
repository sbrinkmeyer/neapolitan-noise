name: Build Native Installers

# Builds the Rust app in native/ for all three platforms in parallel, each on its
# own runner OS, then attaches the artifacts to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release and tag"
        required: true
        default: false
        type: boolean
      tag:
        description: "Tag for release (example: v3.0.0)"
        required: false
        type: string
  push:
    tags:
      - 'v*'
  # Validates all three platforms on a PR without publishing anything: the
  # release job is gated on push/dispatch below. Also the only way to exercise
  # this workflow before it reaches the default branch, since workflow_dispatch
  # only lists workflows already on main.
  pull_request:
    paths:
      - 'native/**'
      - 'packaging/**'
      - '.github/workflows/native-release.yml'
      - '.github/scripts/resolve-version.sh'

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build arm64
        run: cargo build --release --manifest-path native/Cargo.toml --target aarch64-apple-darwin

      - name: Build x64
        run: cargo build --release --manifest-path native/Cargo.toml --target x86_64-apple-darwin

      - name: Fuse into a universal binary
        run: |
          lipo -create -output "$RUNNER_TEMP/neaponoise" \
            native/target/aarch64-apple-darwin/release/neaponoise \
            native/target/x86_64-apple-darwin/release/neaponoise
          lipo -archs "$RUNNER_TEMP/neaponoise"

      - name: Bundle .app and DMG
        run: bash packaging/macos/bundle.sh "$RUNNER_TEMP/neaponoise" "${{ steps.v.outputs.version }}" dist-native

      - uses: actions/upload-artifact@v5
        with:
          name: neapolitan-noise-macos
          path: dist-native/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        shell: bash
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      # Single self-contained exe — no installer needed for a portable utility.
      - name: Stage exe
        shell: bash
        run: |
          mkdir -p dist-native
          cp native/target/release/neaponoise.exe \
             "dist-native/Neapolitan-Noise-${{ steps.v.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: neapolitan-noise-windows
          path: dist-native/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64 AppImage)
    # Pinned deliberately: the runner's glibc becomes the AppImage's minimum, and
    # 24.04 would raise that floor to 2.39 and break older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Build AppImage
        run: bash packaging/linux/appimage.sh native/target/release/neaponoise "${{ steps.v.outputs.version }}" dist-native

      - uses: actions/upload-artifact@v5
        with:
          name: neapolitan-noise-linux
          path: dist-native/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate release input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "When create_release is true, provide inputs.tag (example: v3.0.0)."
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          pattern: neapolitan-noise-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # No `set -e`. Publishing talks to a network API that returns transient
          # 5xx, and aborting on the first one strands a tagged release with no
          # assets. Every step below checks its own outcome and retries what is
          # worth retrying.

          # --- preconditions --------------------------------------------------
          # Name what is missing rather than letting a glob quietly expand to
          # nothing and "succeed".
          missing=0
          for pattern in \
            "release-assets/Neapolitan-Noise-*-macos-*.dmg" \
            "release-assets/Neapolitan-Noise-*-windows-x64.exe" \
            "release-assets/Neapolitan-Noise-*-linux-x86_64.AppImage"; do
            # shellcheck disable=SC2086
            if ! compgen -G "$pattern" >/dev/null; then
              echo "::error::no artifact matching $pattern"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Artifacts present:"; ls -lhR release-assets || true
            exit 1
          fi

          for f in release-assets/*; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty"
              exit 1
            fi
          done
          ls -lh release-assets

          # --- retry helper ---------------------------------------------------
          # GitHub's releases API 502s often enough to matter. Retry with backoff
          # and surface the output of every attempt.
          retry() {
            local what="$1"; shift
            local attempt=1 max=5 delay=5 output status
            while :; do
              output="$("$@" 2>&1)"; status=$?
              if [ "$status" -eq 0 ]; then
                [ -n "$output" ] && echo "$output"
                return 0
              fi
              echo "$output"
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$what failed after $max attempts"
                return "$status"
              fi
              echo "$what failed (attempt $attempt/$max, exit $status); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          cat > release-notes.md <<'EOF'
          Native builds — no runtime to install, one self-contained binary per platform.

          | Platform | Asset |
          | --- | --- |
          | macOS 11+ (Apple Silicon and Intel) | `.dmg` |
          | Windows 10+ x64 | `.exe` |
          | Linux x86_64 (glibc 2.35+) | `.AppImage` |

          ## macOS: unsigned build

          These builds are ad-hoc signed but not notarized, so Gatekeeper will warn
          on first launch:

          1. Drag Neapolitan Noise to Applications.
          2. Right-click "Neapolitan Noise.app" in Finder and choose Open.
          3. Click Open again to confirm.

          Terminal alternative:

              xattr -dr com.apple.quarantine "/Applications/Neapolitan Noise.app"

          Only bypass Gatekeeper for builds you trust.

          ## Windows: unsigned build

          SmartScreen may show "Windows protected your PC". Choose More info →
          Run anyway.

          ## Linux

              chmod +x Neapolitan-Noise-*.AppImage && ./Neapolitan-Noise-*.AppImage
          EOF

          # --- publish --------------------------------------------------------
          # A 502 can still create the release server-side before the response
          # fails, so decide create-vs-update from the API, not from whether an
          # earlier attempt reported success. That also makes a re-run safe.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; updating it"
            retry "release edit" gh release edit "$RELEASE_TAG" \
              --title "Neapolitan Noise $RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --notes-file release-notes.md || exit 1
          else
            echo "creating release $RELEASE_TAG"
            if ! retry "release create" gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "Neapolitan Noise $RELEASE_TAG" \
              --notes-file release-notes.md; then
              # Last check before giving up: the create may have landed even
              # though every response looked like a failure.
              gh release view "$RELEASE_TAG" >/dev/null 2>&1 || exit 1
              echo "create reported failure but the release exists; continuing"
            fi
          fi

          # Upload separately from create so a partial upload can be re-driven
          # without recreating anything. --clobber makes it idempotent.
          upload_failed=0
          for asset in release-assets/*; do
            retry "upload $(basename "$asset")" \
              gh release upload "$RELEASE_TAG" "$asset" --clobber || upload_failed=1
          done

          # --- verify ---------------------------------------------------------
          # Confirm what is actually attached, rather than trusting exit codes.
          echo "verifying attached assets"
          attached="$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' 2>/dev/null)"
          echo "$attached"

          expected=$(ls -1 release-assets | wc -l | tr -d ' ')
          actual=$(printf '%s\n' "$attached" | grep -c . || true)
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected assets attached, found $actual"
            exit 1
          fi
          if printf '%s\n' "$attached" | awk '$2 == 0 { exit 1 }'; then
            :
          else
            echo "::error::at least one attached asset has size 0"
            exit 1
          fi
          if [ "$upload_failed" -ne 0 ]; then
            echo "::error::an upload reported failure; assets verified but review the log"
            exit 1
          fi

          echo "published $RELEASE_TAG with $actual assets"
