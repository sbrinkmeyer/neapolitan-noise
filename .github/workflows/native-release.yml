name: Build Native Installers

# Builds the Rust app in native/ for all three platforms in parallel, each on its
# own runner OS, then attaches the artifacts to a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release and tag"
        required: true
        default: false
        type: boolean
      tag:
        description: "Tag for release (example: v3.0.0)"
        required: false
        type: string
  push:
    tags:
      - 'v*'
  # Validates all three platforms on a PR without publishing anything: the
  # release job is gated on push/dispatch below. Also the only way to exercise
  # this workflow before it reaches the default branch, since workflow_dispatch
  # only lists workflows already on main.
  pull_request:
    paths:
      - 'native/**'
      - 'packaging/**'
      - '.github/workflows/native-release.yml'
      - '.github/scripts/resolve-version.sh'

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build arm64
        run: cargo build --release --manifest-path native/Cargo.toml --target aarch64-apple-darwin

      - name: Build x64
        run: cargo build --release --manifest-path native/Cargo.toml --target x86_64-apple-darwin

      - name: Fuse into a universal binary
        run: |
          lipo -create -output "$RUNNER_TEMP/brownie" \
            native/target/aarch64-apple-darwin/release/brownie \
            native/target/x86_64-apple-darwin/release/brownie
          lipo -archs "$RUNNER_TEMP/brownie"

      - name: Bundle .app and DMG
        run: bash packaging/macos/bundle.sh "$RUNNER_TEMP/brownie" "${{ steps.v.outputs.version }}" dist-native

      - uses: actions/upload-artifact@v5
        with:
          name: brownie-native-macos
          path: dist-native/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        shell: bash
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      # Single self-contained exe — no installer needed for a portable utility.
      - name: Stage exe
        shell: bash
        run: |
          mkdir -p dist-native
          cp native/target/release/brownie.exe \
             "dist-native/Brownie-${{ steps.v.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v5
        with:
          name: brownie-native-windows
          path: dist-native/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux (x86_64 AppImage)
    # Pinned deliberately: the runner's glibc becomes the AppImage's minimum, and
    # 24.04 would raise that floor to 2.39 and break older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        run: bash .github/scripts/resolve-version.sh "${{ inputs.tag }}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Test
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Build AppImage
        run: bash packaging/linux/appimage.sh native/target/release/brownie "${{ steps.v.outputs.version }}" dist-native

      - uses: actions/upload-artifact@v5
        with:
          name: brownie-native-linux
          path: dist-native/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate release input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ inputs.tag }}" ]; then
            echo "When create_release is true, provide inputs.tag (example: v3.0.0)."
            exit 1
          fi

      - uses: actions/download-artifact@v5
        with:
          pattern: brownie-native-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -lh release-assets

          cat > release-notes.md <<'EOF'
          Native builds — no runtime to install, one self-contained binary per platform.

          | Platform | Asset |
          | --- | --- |
          | macOS 11+ (Apple Silicon and Intel) | `.dmg` |
          | Windows 10+ x64 | `.exe` |
          | Linux x86_64 (glibc 2.35+) | `.AppImage` |

          ## macOS: unsigned build

          These builds are ad-hoc signed but not notarized, so Gatekeeper will warn
          on first launch:

          1. Drag Brownie to Applications.
          2. Right-click Brownie.app in Finder and choose Open.
          3. Click Open again to confirm.

          Terminal alternative:

              xattr -dr com.apple.quarantine /Applications/Brownie.app

          Only bypass Gatekeeper for builds you trust.

          ## Windows: unsigned build

          SmartScreen may show "Windows protected your PC". Choose More info →
          Run anyway.

          ## Linux

              chmod +x Brownie-*.AppImage && ./Brownie-*.AppImage
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Brownie $RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "Brownie $RELEASE_TAG" \
              --notes-file release-notes.md
          fi
